<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8" />
  <title>OpenStock 初次設定</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0a0a0a;
      color: #e5e7eb;
      font-family: "PingFang TC", "Hiragino Sans CNS", "Noto Sans TC", sans-serif;
    }
    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 40px 28px;
    }
    h1 { font-size: 24px; margin: 0 0 8px; color: #fff; }
    p { color: #9ca3af; line-height: 1.6; font-size: 14px; }
    label { display: block; margin: 20px 0 8px; font-size: 13px; color: #d1d5db; }
    input {
      width: 100%;
      box-sizing: border-box;
      background: #111827;
      border: 1px solid #374151;
      color: #fff;
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
    }
    input:focus { outline: 2px solid #14b8a6; border-color: transparent; }
    .actions { display: flex; gap: 12px; margin-top: 24px; }
    button {
      flex: 1;
      border: 0;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 14px;
      cursor: pointer;
    }
    .primary { background: #14b8a6; color: #042f2e; font-weight: 700; }
    .ghost { background: transparent; color: #99f6e4; border: 1px solid #134e4a; }
    a { color: #5eead4; }
    .hint { font-size: 12px; color: #6b7280; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>初次設定</h1>
    <p>圖表會透過 TradingView 顯示。搜尋股票、公司資料與新聞需要免費的 Finnhub API 金鑰。</p>
    <p class="hint">申請：<a href="https://finnhub.io" target="_blank">https://finnhub.io</a>。金鑰只存在這台電腦的應用程式資料夾，不會上傳。</p>
    <label for="key">Finnhub API 金鑰（可略過）</label>
    <input id="key" type="text" autocomplete="off" placeholder="請貼上 API 金鑰" />
    <div class="actions">
      <button class="ghost" id="skip">稍後再說</button>
      <button class="primary" id="save">儲存並啟動</button>
    </div>
  </div>
  <script>
    const api = window.openstockDesktop;
    document.getElementById('save').addEventListener('click', async () => {
      const finnhubApiKey = document.getElementById('key').value.trim();
      await api.saveSetup({ finnhubApiKey });
    });
    document.getElementById('skip').addEventListener('click', async () => {
      await api.skipSetup();
    });
  </script>
</body>
</html>
